[project]
name = "agents-ci"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["dagger-io", "dagger-clients-core", "dagger-clients-socket-firewall", "dagger-clients-datadog-static-analyzer"]

[build-system]
requires = ["uv_build>=0.8.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["sdk", "clients/core", "clients/socket-firewall", "clients/datadog-static-analyzer"]

[tool.uv.sources]
dagger-io = { workspace = true }
dagger-clients-core = { workspace = true }
dagger-clients-socket-firewall = { workspace = true }
dagger-clients-datadog-static-analyzer = { workspace = true }
