# Alembic configuration. Deliberately minimal: the database URL is not here, because it
# differs per environment and in production carries no password at all — env.py reads
# DATABASE_URL instead. Nothing in this file is a secret.

[alembic]
# %(here)s is alembic.ini's own directory. A bare "migrations" would resolve against the
# working directory instead, so `alembic -c backend/alembic.ini` from the repo root — how
# every just recipe invokes it — would look for ./migrations and fail.
script_location = %(here)s/migrations

# Migrations are named 0001_..., 0002_... so `ls` shows them in apply order. The revision
# graph is what Alembic actually follows; the prefix is for humans reading the directory.
file_template = %%(rev)s_%%(slug)s

# Timezone for the timestamp in generated files. UTC so two machines in different places
# produce comparable output.
timezone = UTC

# Fail rather than silently truncate an over-long slug.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# INFO so a deploy log shows which revisions ran; this is the only record that a
# migration happened at all.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
