[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Keep this at minor granularity. Dependabot's uv updater only ships one patch
# release per supported minor (3.10.* through 3.14.*), so a patch-level floor
# like ">=3.14.6" makes its dependency-graph job abort with
# tool_version_not_supported. See renovate.json for the rule that stops the
# floor from being bumped back to a patch version.
requires-python = ">=3.14"
dependencies = [
    # Schema migrations. SQLAlchemy comes with it and is used only as the connection
    # layer Alembic needs — the app itself stays on raw psycopg, and there are no ORM
    # models here, so `alembic revision --autogenerate` does not apply. Migrations are
    # hand-written SQL in backend/migrations/versions/.
    "alembic>=1.18.5",
    "anthropic>=0.120.2",
    # Mints the RDS IAM auth token the app connects with, signed locally from the
    # instance profile's credentials. The only reason an AWS SDK is in the runtime image.
    #
    # Floor is the version this was verified against — boto3 and botocore ship in
    # lockstep, so this pins botocore 1.43.62 too. That matters more than usual here:
    # botocore's own region resolution reads AWS_DEFAULT_REGION and not AWS_REGION, and
    # db.aws_region() bridges that difference. See test_db.py.
    "boto3>=1.43.62",
    "fastapi>=0.141.1",
    "google-auth[requests]>=2.56.2",
    "itsdangerous>=2.2.0",
    # [binary] ships a prebuilt libpq so the runtime image needs no C toolchain or
    # system libpq; [pool] is the connection pool db.py opens at startup.
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.0",
]

[tool.ruff]
# The linter runs as `ruff check backend` from the repo root, so tell ruff that
# backend/ is a source root — otherwise isort files the local pantry modules
# under third-party.
src = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    # Starts the Postgres the store tests run against. See backend/conftest.py — the
    # store is worth testing against the real thing, and a container is the only way to
    # do that without asking every developer to install and run a server by hand.
    "testcontainers[postgres]>=4.15.0",
]
