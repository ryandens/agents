[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.140.13",
    "google-auth[requests]>=2.56.2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.ruff]
# The linter runs as `ruff check backend` from the repo root, so tell ruff that
# backend/ is a source root — otherwise isort files the local pantry modules
# under third-party.
src = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
