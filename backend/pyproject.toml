[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.140.13",
    "google-auth[requests]>=2.56.2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.ruff.lint]
# Ruff's default rule set, stated explicitly. Ruff 0.16 widened its defaults,
# which turned a routine version bump into a silent lint-policy change. Pinning
# the selection keeps upgrades mechanical; new rules get adopted deliberately.
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
