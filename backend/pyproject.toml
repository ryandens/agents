[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Keep this at minor granularity. Dependabot's uv updater only ships one patch
# release per supported minor (3.10.* through 3.14.*), so a patch-level floor
# like ">=3.14.6" makes its dependency-graph job abort with
# tool_version_not_supported. See renovate.json for the rule that stops the
# floor from being bumped back to a patch version.
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "google-auth[requests]>=2.56.2",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.52.0",
]

[tool.ruff]
# The linter runs as `ruff check backend` from the repo root, so tell ruff that
# backend/ is a source root — otherwise isort files the local pantry modules
# under third-party.
src = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
