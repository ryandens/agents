name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Just
        uses: taiki-e/install-action@7e7e99c806b67e3f8b9b0da9fb46af4261e64584 # just

      # Python version comes from backend/.python-version, which uv reads itself.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install dependencies
        run: just backend-install

      - name: Check
        run: just backend-check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Just
        uses: taiki-e/install-action@7e7e99c806b67e3f8b9b0da9fb46af4261e64584 # just

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: just frontend-install

      - name: Check
        run: just frontend-check
