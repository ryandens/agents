name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just

      # Python version comes from backend/.python-version, which uv reads itself.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: just backend-install

      - name: Check
        run: just backend-check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@3d23c1bbdafe696dfccad2664945a04f47d03dc3 # just

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: just frontend-install

      - name: Check
        run: just frontend-check

  # Builds the same image the release workflow ships and checks that one container
  # really does serve the frontend at / and the API under /api. Neither the backend
  # nor the frontend job can see that seam on its own.
  docker:
    runs-on: ubuntu-latest
    env:
      SMOKE_EXPECTED_CLIENT_ID: smoke-test-client-id.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@7e7e99c806b67e3f8b9b0da9fb46af4261e64584 # just

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Single-platform and loaded into the local daemon so the smoke test can run it;
      # the release workflow is what builds multi-arch.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: agents:ci
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.SMOKE_EXPECTED_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: just smoke agents:ci
