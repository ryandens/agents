name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dagger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Run checks and export reports
        id: checks
        run: nix develop --no-write-lock-file --command dagger api call ci export --path "$GITHUB_WORKSPACE/reports" --wipe --progress report

      - name: Enforce check and scanner results
        if: ${{ !cancelled() && hashFiles('reports/results.json') != '' }}
        run: |
          cat reports/results.json
          for scanner in datadog opengrep; do
            if [ -f "reports/$scanner/scan.log" ]; then
              cat "reports/$scanner/scan.log"
            fi
          done
          exit "$(cat reports/exit-code)"

      - name: Upload results to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('reports/datadog/results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/datadog/results.sarif
          category: datadog-static-analyzer

      - name: Upload OpenGrep findings
        if: ${{ !cancelled() && hashFiles('reports/opengrep/results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/opengrep/results.sarif
          category: opengrep

      - name: Export image for vulnerability scanning
        id: image-export
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: nix develop --no-write-lock-file --command dagger api call image --platform linux/amd64 export --path "$RUNNER_TEMP/agents.tar" --progress report

      - name: Scan image for vulnerabilities
        id: trivy
        if: ${{ !cancelled() && steps.image-export.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2
          scan-type: image
          input: ${{ runner.temp }}/agents.tar
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy results to GitHub code scanning
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
