name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dagger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      # Direct execution must exclude developer state before uploading sources.
      - name: Verify ignored development inputs
        run: |
          for directory in .venv frontend/node_modules .claude .aws .codex .agents .direnv .dagger/.venv dagger/actionlint/.venv dagger/datadog-static-analyzer/.venv dagger/opengrep/.venv dagger/renovate-config/.venv dagger/socket-firewall/.venv; do
            mkdir -p "$directory"
            printf 'ignored input sentinel\n' > "$directory/dagger-input-sentinel"
            chmod 000 "$directory/dagger-input-sentinel"
          done
          printf 'LOCAL_INPUT_SENTINEL=ignored\n' > .env
          chmod 000 .env

      # Dagger discovers checks, shares dependencies and reports each result.
      - name: Check
        id: checks
        run: nix develop --no-write-lock-file --command dagger check -j 2 --progress report

      # Publish security results even when an application check failed.
      - name: Prepare scan source
        id: scan-source
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            source="$(python3 scripts/prepare_datadog_scan.py "$BASE_SHA" "$HEAD_SHA")"
          else
            source="."
          fi
          echo "DDSA_INPUT=$source" >> "$GITHUB_ENV"

      - name: Run static analysis and export report
        id: datadog-scan
        if: ${{ !cancelled() && steps.scan-source.outcome == 'success' }}
        run: |
          if [ "$DDSA_INPUT" = "." ]; then
            nix develop --no-write-lock-file --command dagger api call datadog-report export --path "$GITHUB_WORKSPACE/reports/datadog" --progress report
          else
            nix develop --no-write-lock-file --command dagger api call datadog-report --source "$DDSA_INPUT" export --path "$GITHUB_WORKSPACE/reports/datadog" --progress report
          fi

      - name: Upload results to GitHub code scanning
        if: ${{ !cancelled() && steps.datadog-scan.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/datadog/results.sarif
          category: datadog-static-analyzer

      - name: Enforce scan policy
        if: ${{ !cancelled() && steps.datadog-scan.outcome == 'success' }}
        run: |
          cat reports/datadog/scan.log
          exit "$(cat reports/datadog/exit-code)"

      - name: Prepare OpenGrep scan source
        id: opengrep-source
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            source="$(python3 scripts/prepare_opengrep_scan.py "$BASE_SHA" "$HEAD_SHA")"
          else
            source="."
          fi
          echo "OPENGREP_INPUT=$source" >> "$GITHUB_ENV"

      - name: Run OpenGrep and export report
        id: opengrep-scan
        if: ${{ !cancelled() && steps.opengrep-source.outcome == 'success' }}
        run: |
          if [ "$OPENGREP_INPUT" = "." ]; then
            nix develop --no-write-lock-file --command dagger api call opengrep-report export --path "$GITHUB_WORKSPACE/reports/opengrep" --progress report
          else
            nix develop --no-write-lock-file --command dagger api call opengrep-report --source "$OPENGREP_INPUT" export --path "$GITHUB_WORKSPACE/reports/opengrep" --progress report
          fi

      - name: Upload OpenGrep findings
        if: ${{ !cancelled() && steps.opengrep-scan.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/opengrep/results.sarif
          category: opengrep

      - name: Enforce OpenGrep policy
        if: ${{ !cancelled() && steps.opengrep-scan.outcome == 'success' }}
        run: |
          cat reports/opengrep/scan.log
          exit "$(cat reports/opengrep/exit-code)"

      - name: Export image for vulnerability scanning
        id: image-export
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: nix develop --no-write-lock-file --command dagger api call image --platform linux/amd64 export --path "$RUNNER_TEMP/agents.tar" --progress report

      - name: Scan image for vulnerabilities
        id: trivy
        if: ${{ !cancelled() && steps.image-export.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2
          scan-type: image
          input: ${{ runner.temp }}/agents.tar
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy results to GitHub code scanning
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
