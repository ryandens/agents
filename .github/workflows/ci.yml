name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Needs a Docker daemon, which ubuntu-latest provides: the store tests run against a
  # real Postgres that backend/conftest.py starts with testcontainers. A runner without
  # Docker would fail collection rather than skip those tests.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@e1ad73d8df9252ed26a05bad034abe5444e7ad28 # just

      # Python version comes from backend/.python-version, which uv reads itself.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: just backend-install

      - name: Check
        run: just backend-check

  # The Safari exporter. Its tests build a synthetic history database rather than
  # reading a real one, so they need neither macOS nor Full Disk Access and run here.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@e1ad73d8df9252ed26a05bad034abe5444e7ad28 # just

      # Python version comes from cli/.python-version, which uv reads itself.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: just cli-dev-install

      - name: Check
        run: just cli-check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@e1ad73d8df9252ed26a05bad034abe5444e7ad28 # just

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: just frontend-install

      - name: Check
        run: just frontend-check

  # Datadog's static analyzer, run straight from its release archive rather than through
  # DataDog/datadog-static-analyzer-github-action. The action also installs datadog-ci and
  # uploads results, which needs DD_API_KEY/DD_APP_KEY org credentials this repo does not
  # have. The analyzer binary ships its own rulesets and needs no credentials to scan, so
  # the install logic below is lifted from that action's `Set up environment` and
  # `Install datadog-static-analyzer` steps and the upload is dropped.
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned rather than the action's `releases/latest`, which silently changes the
      # analyzer and its bundled rulesets underneath us — a new ruleset could turn CI
      # red on an unrelated PR. Renovate keeps the version in lockstep with upstream
      # release tags; see the customManager in renovate.json.
      - name: Install datadog-static-analyzer
        env:
          DDSA_VERSION: 0.9.1
        run: |
          case "${{ runner.arch }}" in
            X64)   DDSA_ARCH="x86_64" ;;
            ARM64) DDSA_ARCH="aarch64" ;;
            *)
              echo "::error title=Unsupported architecture::${{ runner.arch }}"
              exit 1
              ;;
          esac

          if [ "${{ runner.os }}" = "Linux" ]; then
            DDSA_OS="unknown-linux-gnu"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            DDSA_OS="apple-darwin"
          else
            echo "::error title=Unsupported platform::${{ runner.os }}/${{ runner.arch }}"
            exit 1
          fi

          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          filename="datadog-static-analyzer-$DDSA_ARCH-$DDSA_OS.zip"
          tmpdir="$(mktemp -d)"
          curl -fsSL --retry 5 "https://github.com/DataDog/datadog-static-analyzer/releases/download/$DDSA_VERSION/$filename" -o "$tmpdir/$filename"
          unzip -q "$tmpdir/$filename" -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/datadog-static-analyzer"

      # Rules and path exclusions come from code-security.datadog.yaml at the repo root,
      # so this run matches what the same binary reports locally.
      - name: Run static analysis
        run: |
          datadog-static-analyzer \
            -i "$GITHUB_WORKSPACE" \
            -o "$RUNNER_TEMP/results.sarif" \
            -f sarif \
            --print-violations \
            --fail-on-any-violation error,warning

  # Builds the same image the release workflow ships and checks that one container
  # really does serve the frontend at / and the API under /api, backed by a Postgres
  # container `just smoke` starts alongside it. Neither the backend nor the frontend job
  # can see those seams on its own.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@e1ad73d8df9252ed26a05bad034abe5444e7ad28 # just

      # The smoke test runs the Safari exporter against the container to check that what
      # the CLI posts is what the API accepts. Without uv those checks skip rather than
      # fail, which would quietly leave that seam untested here.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Single-platform and loaded into the local daemon so the smoke test can run it;
      # the release workflow is what builds multi-arch.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: just smoke agents:ci
