name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Needs a Docker daemon, which ubuntu-latest provides: the store tests run against a
  # real Postgres that backend/conftest.py starts with testcontainers. A runner without
  # Docker would fail collection rather than skip those tests.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@ae666e311a8d98d0043e81161903fc9f9beb8689 # just

      # Python version comes from backend/.python-version, which uv reads itself.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Install the interpreter before enabling the package proxy. uv fetches Python
      # runtimes from GitHub releases rather than a supported package registry.
      - name: Install Python
        run: uv python install "$(cat backend/.python-version)"

      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies
        run: just backend-install

      - name: Check
        run: just backend-check

  # The Safari exporter. Its tests build a synthetic history database rather than
  # reading a real one, so they need neither macOS nor Full Disk Access and run here.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@ae666e311a8d98d0043e81161903fc9f9beb8689 # just

      # Python version comes from cli/.python-version, which uv reads itself.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # As in the backend job, keep uv's GitHub-hosted interpreter download outside
      # the registry firewall and route the dependency sync itself through sfw.
      - name: Install Python
        run: uv python install "$(cat cli/.python-version)"

      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies
        run: just cli-dev-install

      - name: Check
        run: just cli-check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@ae666e311a8d98d0043e81161903fc9f9beb8689 # just

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Socket Firewall: routes package downloads through a local proxy that
      # blocks known-malicious packages at install time. No API key needed.
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies
        run: just frontend-install

      - name: Check
        run: just frontend-check

  # Lints the GitHub Actions workflow files themselves.
  # https://github.com/rhysd/actionlint/blob/main/docs/usage.md#use-actionlint-on-github-actions
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The actionlint version and the download script's pinned commit are kept
      # in lockstep with upstream GitHub release tags by Renovate. The commit
      # below is the v1.7.12 tag; see the customManager in renovate.json.
      - name: Download actionlint
        id: get_actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  # Datadog's static analyzer, run straight from its release archive rather than through
  # DataDog/datadog-static-analyzer-github-action. The action also installs datadog-ci and
  # uploads results, which needs DD_API_KEY/DD_APP_KEY org credentials this repo does not
  # have. The analyzer binary ships its own rulesets and needs no credentials to scan, so
  # the install logic below is lifted from that action's `Set up environment` and
  # `Install datadog-static-analyzer` steps. Results go to GitHub code scanning instead.
  datadog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PR scans need both sides of the diff. Pushes to main still scan the full tree.
          fetch-depth: 0

      # Pinned rather than the action's `releases/latest`, which silently changes the
      # analyzer and its bundled rulesets underneath us — a new ruleset could turn CI
      # red on an unrelated PR. Renovate keeps the version in lockstep with upstream
      # release tags; see the customManager in renovate.json.
      - name: Install datadog-static-analyzer
        env:
          DDSA_VERSION: 0.9.3
        run: |
          case "${{ runner.arch }}" in
            X64)   DDSA_ARCH="x86_64" ;;
            ARM64) DDSA_ARCH="aarch64" ;;
            *)
              echo "::error title=Unsupported architecture::${{ runner.arch }}"
              exit 1
              ;;
          esac

          if [ "${{ runner.os }}" = "Linux" ]; then
            DDSA_OS="unknown-linux-gnu"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            DDSA_OS="apple-darwin"
          else
            echo "::error title=Unsupported platform::${{ runner.os }}/${{ runner.arch }}"
            exit 1
          fi

          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          filename="datadog-static-analyzer-$DDSA_ARCH-$DDSA_OS.zip"
          tmpdir="$(mktemp -d)"
          curl -fsSL --retry 5 "https://github.com/DataDog/datadog-static-analyzer/releases/download/$DDSA_VERSION/$filename" -o "$tmpdir/$filename"
          unzip -q "$tmpdir/$filename" -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/datadog-static-analyzer"

      # Datadog's native --diff-aware mode requires Datadog credentials and previously
      # uploaded Datadog results. This repo publishes to GitHub instead, so build a scan
      # tree containing only added or modified PR files while preserving their paths.
      - name: Prepare pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scan_dir="$RUNNER_TEMP/datadog-scan"
          mkdir -p "$scan_dir"
          cp code-security.datadog.yaml "$scan_dir/"

          while IFS= read -r -d '' changed_file; do
            if [ -f "$changed_file" ]; then
              cp --parents -- "$changed_file" "$scan_dir/"
            fi
          done < <(git diff --name-only --diff-filter=ACMRTUXB -z "$BASE_SHA" "$HEAD_SHA")

          echo "DDSA_INPUT=$scan_dir" >> "$GITHUB_ENV"

      # Rules and path exclusions come from code-security.datadog.yaml at the repo root,
      # so this run matches what the same binary reports locally.
      - name: Run static analysis
        run: |
          datadog-static-analyzer \
            -i "${DDSA_INPUT:-$GITHUB_WORKSPACE}" \
            -o "$RUNNER_TEMP/results.sarif" \
            -f sarif \
            --print-violations \
            --fail-on-any-violation error,warning

      # Run even when the analyzer reports violations (and therefore exits nonzero) so
      # those findings are still available in pull requests and the Security tab.
      - name: Upload results to GitHub code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/results.sarif
          category: datadog-static-analyzer

  # Full-tree backlog scan only. Once the existing findings have been triaged, this can
  # run on pull requests with a baseline so new findings become the merge gate.
  opengrep:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenGrep
        env:
          # renovate: datasource=custom.opengrep-releases depName=opengrep/opengrep
          OPENGREP_VERSION: v1.29.0
          OPENGREP_SHA256: sha256:3365ef49d04893e01338d85d9bbd49b2bd5261ad4c9c0df0a6a0f8d44232ae13
        run: |
          install_dir="$RUNNER_TEMP/opengrep/bin"
          mkdir -p "$install_dir"
          curl -fsSL --retry 5 \
            "https://github.com/opengrep/opengrep/releases/download/$OPENGREP_VERSION/opengrep_manylinux_x86" \
            -o "$install_dir/opengrep"
          echo "${OPENGREP_SHA256#sha256:}  $install_dir/opengrep" | sha256sum --check --strict
          chmod +x "$install_dir/opengrep"
          echo "$install_dir" >> "$GITHUB_PATH"

      # Capture `ci`'s status instead of ending the job here: exit 1 means findings and
      # is expected during backlog cleanup; other nonzero statuses fail after upload.
      - name: Scan the full repository
        id: scan
        run: |
          status=0
          opengrep ci \
            --config p/default \
            --sarif-output="$RUNNER_TEMP/opengrep-results.sarif" || status=$?
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"

      - name: Publish findings to GitHub code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/opengrep-results.sarif
          category: opengrep-backlog

      - name: Fail on scanner errors
        if: ${{ !cancelled() && steps.scan.outputs.exit-code != '0' && steps.scan.outputs.exit-code != '1' }}
        env:
          OPENGREP_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        run: |
          echo "OpenGrep failed with exit code $OPENGREP_EXIT_CODE" >&2
          exit "$OPENGREP_EXIT_CODE"

  # Builds the same image the release workflow ships and checks that one container
  # really does serve the frontend at / and the API under /api, backed by a Postgres
  # container `just smoke` starts alongside it. Neither the backend nor the frontend job
  # can see those seams on its own.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        uses: taiki-e/install-action@ae666e311a8d98d0043e81161903fc9f9beb8689 # just

      # The smoke test runs the Safari exporter against the container to check that what
      # the CLI posts is what the API accepts. Without uv those checks skip rather than
      # fail, which would quietly leave that seam untested here.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Single-platform and loaded into the local daemon so the smoke test can run it;
      # the release workflow is what builds multi-arch.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the image only after it lands on main. SARIF feeds vulnerability findings
      # to code scanning; deliberately omit Trivy's `format: github` and `github-pat`
      # inputs, which are the separate path that submits an SBOM to Dependency Graph.
      - name: Scan image for vulnerabilities
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.74.0
          scan-type: image
          image-ref: agents:ci
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy results to GitHub code scanning
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Smoke test
        run: just smoke agents:ci
