name: Promptfoo Code Scan

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: promptfoo-code-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # The installed Promptfoo Scanner app authenticates with OIDC; no API key.
      id-token: write
      security-events: write
    # Keep PR builds and dependency installation in separate jobs from the scanner.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Promptfoo Code Scan
        id: promptfoo-code-scan
        uses: promptfoo/code-scan-action@11b7322013b2ba70a311b596c90dad5bcbea8634 # v0.2.2
        with:
          min-severity: medium
          sarif-output-path: promptfoo-code-scan.sarif

      # Skipped scans do not produce SARIF and must not publish an empty result.
      - name: Upload results to GitHub code scanning
        if: ${{ !cancelled() && steps.promptfoo-code-scan.outputs.sarif-path != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.promptfoo-code-scan.outputs.sarif-path }}
          category: promptfoo-code-scan
