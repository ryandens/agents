name: Dagger sequential cache benchmark

on:
  pull_request:
    paths:
      - .github/workflows/dagger-cache-benchmark.yml

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps: &benchmark
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Prepare CLI and record runner resources
        run: |
          git rev-parse HEAD
          nix develop --no-write-lock-file --command dagger version
          nproc
          free -m
          docker ps --format '{{.ID}} {{.Image}} {{.Names}}'
      - name: Run checks and enforce saved status
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: |
          nix develop --no-write-lock-file --command dagger api call ci export --path "$RUNNER_TEMP/reports" --wipe --progress report
          cat "$RUNNER_TEMP/reports/results.json"
          exit "$(cat "$RUNNER_TEMP/reports/exit-code")"
      - name: Record local engine
        run: |
          docker ps --format '{{.ID}} {{.Image}} {{.Names}}'
          while read -r engine; do
            docker inspect --format '{{range .Mounts}}{{println .Type .Destination}}{{end}}' "$engine"
          done < <(docker ps --filter name=dagger-engine --format '{{.ID}}')
      - name: Probe execution result and mutable cache volume
        shell: bash
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          PROBE_ROLE: ${{ github.job }}
        run: |
          query() {
            nix develop --no-write-lock-file --command dagger api query --progress plain "$@"
          }

          key="agents-cache-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          probe_result() {
            query --var "key=$key" <<'GRAPHQL'
          query($key: String!) {
            container {
              from(address: "alpine:3.22") {
                withEnvVariable(name: "PROBE_KEY", value: $key) {
                  withExec(args: ["cat", "/proc/sys/kernel/random/uuid"]) { stdout }
                }
              }
            }
          }
          GRAPHQL
          }

          result=$(probe_result | jq -er '.container.from.withEnvVariable.withExec.stdout')
          printf 'Execution result (%s): %s\n' "$PROBE_ROLE" "$result"
          if [[ "$PROBE_ROLE" == seed ]]; then
            repeated=$(probe_result | jq -er '.container.from.withEnvVariable.withExec.stdout')
            [[ "$repeated" == "$result" ]]
          fi

          cache_id=$(query --var "key=$key" <<'GRAPHQL' | jq -er '.cacheVolume.id'
          query($key: String!) { cacheVolume(key: $key) { id } }
          GRAPHQL
          )
          if [[ "$PROBE_ROLE" == seed ]]; then
            query --var "cache=$cache_id" --var "marker=$result" <<'GRAPHQL'
          query($cache: ID!, $marker: String!) {
            container {
              from(address: "alpine:3.22") {
                withMountedCache(path: "/probe", cache: $cache) {
                  withEnvVariable(name: "MARKER", value: $marker) {
                    withExec(args: ["sh", "-ec", "echo \"$MARKER\" > /probe/marker"]) { stdout }
                  }
                }
              }
            }
          }
          GRAPHQL
          fi

          # Distinct execution environments ensure the second job reads the mount itself.
          marker=$(query --var "cache=$cache_id" --var "role=$PROBE_ROLE" <<'GRAPHQL' | jq -er '.container.from.withMountedCache.withEnvVariable.withExec.stdout'
          query($cache: ID!, $role: String!) {
            container {
              from(address: "alpine:3.22") {
                withMountedCache(path: "/probe", cache: $cache) {
                  withEnvVariable(name: "PROBE_ROLE", value: $role) {
                    withExec(args: ["sh", "-ec", "if test -f /probe/marker; then cat /probe/marker; else echo absent; fi"]) { stdout }
                  }
                }
              }
            }
          }
          GRAPHQL
          )
          printf 'Mutable volume marker (%s): %s\n' "$PROBE_ROLE" "$marker"
          if [[ "$PROBE_ROLE" == seed ]]; then
            [[ "$marker" == "$result" ]]
          fi

  observe:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps: *benchmark
