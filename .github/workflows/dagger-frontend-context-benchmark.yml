name: Dagger frontend context benchmark

on:
  pull_request:
    paths:
      - .github/workflows/dagger-frontend-context-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: "${{ matrix.variant }}, sample ${{ matrix.sample }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [control, candidate]
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Prepare the variant and pinned CLI
        env:
          VARIANT: ${{ matrix.variant }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse HEAD
          printf 'Control module revision %s\n' "$BASE_SHA"
          if [[ "$VARIANT" == control ]]; then
            git show "$BASE_SHA:.dagger/src/agents_ci/__init__.py" > .dagger/src/agents_ci/__init__.py
          fi
          nix develop --no-write-lock-file --command dagger version
          nproc
          free -m
          docker ps --format '{{.ID}} {{.Image}} {{.Names}}'
      - name: Measure the aggregate from a fresh engine
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: |
          /usr/bin/time -f 'Aggregate seconds: %e' \
            nix develop --no-write-lock-file --command dagger api call ci export \
              --path "$RUNNER_TEMP/reports" --wipe --progress report
          cat "$RUNNER_TEMP/reports/results.json"
          exit "$(cat "$RUNNER_TEMP/reports/exit-code")"
      - name: Compare warm exports before and after source edits
        shell: bash
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        run: |
          export_dir="$RUNNER_TEMP/frontend-export"

          build() {
            /usr/bin/time -f "Frontend export ($1) seconds: %e" \
              nix develop --no-write-lock-file --command dagger api call frontend-dist export \
                --path "$export_dir" --wipe --progress plain -vv
            test -s "$export_dir/index.html"
          }

          manifest() (
            cd "$export_dir"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          )

          build initial
          manifest > "$RUNNER_TEMP/initial.sha256"
          printf '\n# Benchmark backend-only edit.\n' >> backend/main.py
          build backend-edit
          manifest > "$RUNNER_TEMP/backend-edit.sha256"
          if cmp -s "$RUNNER_TEMP/initial.sha256" "$RUNNER_TEMP/backend-edit.sha256"; then
            echo "Backend edit: byte-identical export"
          else
            echo "Backend edit: export manifest changed"
          fi

          marker=dagger-benchmark-marker.txt
          test ! -e "frontend/public/$marker"
          test ! -e "$export_dir/$marker"
          printf 'frontend-only test change\n' > "frontend/public/$marker"
          build frontend-edit
          cmp "frontend/public/$marker" "$export_dir/$marker"
          docker ps --format '{{.ID}} {{.Image}} {{.Names}}'
