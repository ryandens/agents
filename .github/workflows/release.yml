name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Verify release
        run: nix develop --no-write-lock-file --command dagger api with-session --progress report python scripts/dagger_check.py -j 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish release image
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          ECR_PASSWORD="$(aws ecr get-login-password)"
          export ECR_PASSWORD
          echo "::add-mask::$ECR_PASSWORD"
          nix develop --no-write-lock-file --command dagger api call publish \
            --address "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_REF_NAME" \
            --registry "$ECR_REGISTRY" --password env://ECR_PASSWORD \
            --progress report > "$RUNNER_TEMP/published-image.txt"
          printf 'Published image: %s\n' "$(cat "$RUNNER_TEMP/published-image.txt")" >> "$GITHUB_STEP_SUMMARY"
