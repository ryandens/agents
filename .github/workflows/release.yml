name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read Dagger version
        id: dagger-version
        run: echo "version=$(cat .dagger-version)" >> "$GITHUB_OUTPUT"

      - name: Install Dagger
        uses: dagger/dagger-for-github@b81317a976cb7f7125469707321849737cd1b3bc # v7
        with:
          version: ${{ steps.dagger-version.outputs.version }}

      - name: Verify release
        run: scripts/dagger check -j 2 --progress report

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish release image
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          ECR_PASSWORD="$(aws ecr get-login-password)"
          export ECR_PASSWORD
          echo "::add-mask::$ECR_PASSWORD"
          scripts/dagger api call publish \
            --address "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_REF_NAME" \
            --registry "$ECR_REGISTRY" --password env:ECR_PASSWORD \
            --progress report > "$RUNNER_TEMP/published-image.txt"
          printf 'Published image: %s\n' "$(cat "$RUNNER_TEMP/published-image.txt")" >> "$GITHUB_STEP_SUMMARY"
