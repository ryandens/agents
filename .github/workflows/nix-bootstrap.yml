name: Validate direct Dagger execution with Nix
'on':
  push:
    branches:
    - codex/dagger-nix-validation
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb
    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d
    - name: Lock and evaluate all supported systems
      run: 'nix flake lock

        git add flake.lock

        nix flake check --all-systems --no-build --no-write-lock-file

        '
    - name: Generate through the standard CLI
      run: nix develop --no-write-lock-file --command dagger generate -y --progress report
    - name: Commit lockfile and generated configuration
      run: "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add flake.lock .dagger dagger dagger.toml dagger.lock\nif ! git diff --cached --quiet; then\n  git commit -m 'build(nix): \U0001F512 Lock Dagger development inputs'\n  git push origin HEAD:codex/dagger-nix-validation\nfi\n"
    - name: Verify ignored development inputs
      run: "for directory in .venv frontend/node_modules .claude .aws .codex .agents .direnv .dagger/.venv dagger/actionlint/.venv dagger/datadog-static-analyzer/.venv dagger/opengrep/.venv dagger/renovate-config/.venv dagger/socket-firewall/.venv; do\n  mkdir -p \"$directory\"\n  printf 'ignored input sentinel\\n' > \"$directory/dagger-input-sentinel\"\n  chmod 000 \"$directory/dagger-input-sentinel\"\ndone\nprintf 'LOCAL_INPUT_SENTINEL=ignored\\n' > .env\nchmod 000 .env\n"
    - name: Run normal check suite directly
      run: nix develop --no-write-lock-file --command dagger check -j 2 --progress report
    - name: Validate datadog report
      run: 'nix develop --no-write-lock-file --command dagger api call datadog-report export --path "$GITHUB_WORKSPACE/reports/datadog" --progress report

        cat reports/datadog/scan.log

        exit "$(cat reports/datadog/exit-code)"

        '
    - name: Validate opengrep report
      run: 'nix develop --no-write-lock-file --command dagger api call opengrep-report export --path "$GITHUB_WORKSPACE/reports/opengrep" --progress report

        cat reports/opengrep/scan.log

        exit "$(cat reports/opengrep/exit-code)"

        '
