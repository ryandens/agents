name: Renovate config

on:
  push:
    branches: [main]
    paths:
      - renovate.json
  pull_request:
    paths:
      - renovate.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Validate Renovate config
        run: npx --yes --package renovate -- renovate-config-validator --no-global renovate.json
