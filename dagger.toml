ignore = ["**/.direnv", "result", "result-*", ".git", ".claude", ".agents", ".codex", ".aws", "**/.venv", "**/node_modules", "**/__pycache__", "**/.pytest_cache", "frontend/.next", "frontend/out", "frontend/coverage", "backend/static", "backend/data", "**/.env", "**/.env.*", "**/*.tfstate*", "**/*.tfvars", "**/.terraform"]

[modules.python-sdk]
source = "github.com/dagger/python-sdk@v1.8.0"

[sdks.python]
module = "python-sdk"

[sdks.python.scopes."dagger/socket-firewall"]
is-module = true
name = "socket-firewall"

[sdks.python.scopes."dagger/socket-firewall".settings]
template = "empty"

[modules.agents-ci]
main = true
source = ".dagger"

[sdks.python.scopes.".dagger"]
clients = ["./dagger/socket-firewall", "./dagger/datadog-static-analyzer", "./dagger/actionlint", "./dagger/opengrep", "./dagger/renovate-config"]
is-module = true
name = "agents-ci"

[sdks.python.scopes.".dagger".settings]
template = "empty"

[sdks.python.scopes."dagger/datadog-static-analyzer"]
is-module = true
name = "datadog-static-analyzer"

[sdks.python.scopes."dagger/datadog-static-analyzer".settings]
template = "empty"

[sdks.python.scopes."dagger/actionlint"]
is-module = true
name = "actionlint"

[sdks.python.scopes."dagger/actionlint".settings]
template = "empty"

[sdks.python.scopes."dagger/opengrep"]
is-module = true
name = "opengrep"

[sdks.python.scopes."dagger/opengrep".settings]
template = "empty"

[sdks.python.scopes."dagger/renovate-config"]
is-module = true
name = "renovate-config"

[sdks.python.scopes."dagger/renovate-config".settings]
template = "empty"

# Reuse the upstream generator; the commit pins its Dagger 1.0 workspace API.
[modules.ruff]
source = "github.com/typesafe-ai/daggerverse/ruff@d536bce38cd73b4e66a757c5687bbbd51ac8ab5b"

[modules.ruff.settings]
# Keep exclusions explicit: this beta does not apply root ignore to all Workspace reads.
exclude = ["**/.direnv", "result", "result-*", ".git", ".claude", ".agents", ".codex", ".aws", "**/.venv", "**/node_modules", "**/__pycache__", "**/.pytest_cache", "frontend/.next", "frontend/out", "frontend/coverage", "backend/static", "backend/data", "**/.env", "**/.env.*", "**/*.tfstate*", "**/*.tfvars", "**/.terraform", "**/.git", "**/sdk/**", "**/clients/**"]
