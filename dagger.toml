ignore = [".git", ".claude", ".agents", ".codex", ".aws", "**/.venv", "**/node_modules", "**/__pycache__", "**/.pytest_cache", "frontend/.next", "frontend/out", "frontend/coverage", "backend/static", "backend/data", "**/.env", "**/.env.*", "**/*.tfstate*", "**/*.tfvars", "**/.terraform"]

[modules.python-sdk]
source = "github.com/dagger/python-sdk@v1.7.0"

[sdks.python]
module = "python-sdk"

[sdks.python.scopes."dagger/socket-firewall"]
is-module = true
name = "socket-firewall"

[sdks.python.scopes."dagger/socket-firewall".settings]
template = "empty"

[modules.agents-ci]
main = true
source = ".dagger"

[sdks.python.scopes.".dagger"]
clients = ["./dagger/socket-firewall", "./dagger/datadog-static-analyzer"]
is-module = true
name = "agents-ci"

[sdks.python.scopes.".dagger".settings]
template = "empty"

[sdks.python.scopes."dagger/datadog-static-analyzer"]
is-module = true
name = "datadog-static-analyzer"

[sdks.python.scopes."dagger/datadog-static-analyzer".settings]
template = "empty"
