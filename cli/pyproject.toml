[project]
name = "safari-history-export"
version = "0.1.0"
description = "Export Safari browsing history to daily CSVs and post it to the agents API"
readme = "README.md"
# Same minor-granularity floor as backend/pyproject.toml, for the same reason: a
# patch-level floor breaks Dependabot's uv updater. See renovate.json.
requires-python = ">=3.14"
dependencies = [
    "google-auth[requests]>=2.56.3",
    "requests>=2.34.2",
]

[project.scripts]
export-safari-history = "safari_history.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safari_history"]

[tool.ruff]
# The linter runs as `ruff check cli` from the repo root, so tell ruff where this
# project's source root is — otherwise isort files safari_history as third-party.
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
